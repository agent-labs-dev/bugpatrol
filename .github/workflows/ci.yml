name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here: it is read from package.json's packageManager,
      # and pinning it twice makes the action refuse to run at all.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check --error-on-warnings
      - run: pnpm knip
      - run: pnpm build
      # The npm package is a bundle of the workspace, so a break in the bundle
      # must fail here, not in a release.
      - run: pnpm --filter bugpatrol build
      - run: node packages/bugpatrol/dist/bin.js --version
      # The landing page in site/, which the Pages workflow deploys from main.
      - run: pnpm --filter @bugpatrol/site typecheck
      - run: pnpm --filter @bugpatrol/site build
      # The capture tests drive a real browser, because font loading and layout
      # only mean anything against a real rendering engine.
      - run: pnpm --filter @bugpatrol/capture exec playwright install --with-deps chromium
      # The recording tests encode real video.
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: pnpm test

  determinism:
    uses: ./.github/workflows/determinism.yml

  # The branch ruleset requires `build` and nothing else, and Mergepatrol merges
  # once required checks pass, so this job carries every check that must hold.
  # It runs on `always()` and fails unless each need succeeded: a job skipped
  # after a failed need counts as passed, to GitHub and to Mergepatrol alike.
  build:
    needs: [checks, determinism]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Required jobs did not succeed: $failed"
            exit 1
          fi
