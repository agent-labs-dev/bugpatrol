name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  id-token: write

concurrency:
  group: bugpatrol-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Must match the environment on the npm trusted publisher; the environment
    # itself only allows deployments from main.
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # packageManager owns the pnpm version; a second pin makes setup fail.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Capture tests need Chromium's real font and layout engine.
      - run: pnpm --filter @bugpatrol/capture exec playwright install --with-deps chromium
      # The recording tests encode real video.
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: pnpm test
      - name: Bump package version
        id: version
        working-directory: packages/bugpatrol
        # The newest v* tag holds the last release. The main rules do not let
        # this workflow push, so the version on main can be older than the tag.
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$last" ]; then
            npm version "${last#v}" --no-git-tag-version --allow-same-version
          fi
          npm version ${{ inputs.bump }} --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"
      # bughunters is the earlier name of bugpatrol: a small wrapper that runs it.
      # It gets the same version and pins that exact bugpatrol version, so the
      # two never drift apart. npm publish does not rewrite workspace:*, so this
      # step writes the pin.
      - name: Pin bughunters to the new version
        working-directory: packages/bughunters
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = pkg.dependencies.bugpatrol = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n');
          " "${{ steps.version.outputs.value }}"
      # The Action on a release tag installs the bugpatrol of that release, so
      # the Action and the CLI always match. main keeps bugpatrol@latest.
      - name: Pin the Action to the new version
        run: |
          sed -i 's/^    default: bugpatrol@latest$/    default: bugpatrol@${{ steps.version.outputs.value }}/' action.yml
          grep -qx '    default: bugpatrol@${{ steps.version.outputs.value }}' action.yml
      - run: pnpm --filter bugpatrol build
      - name: Smoke test package
        run: |
          test "$(node packages/bugpatrol/dist/bin.js --version)" = "${{ steps.version.outputs.value }}"
          node packages/bugpatrol/dist/bin.js --help
          (cd packages/bugpatrol && npm pack --dry-run)
          # The workspace links packages/bugpatrol, so this runs the new build.
          test "$(node packages/bughunters/src/bin.js --version)" = "${{ steps.version.outputs.value }}"
          (cd packages/bughunters && npm pack --dry-run)
      # No token: npm trusts this workflow through OIDC (id-token: write) and
      # attaches provenance on its own.
      - name: Publish to npm
        working-directory: packages/bugpatrol
        run: npm publish
      # After bugpatrol, so the exact version that bughunters pins exists.
      - name: Publish bughunters to npm
        working-directory: packages/bughunters
        run: npm publish
      # The release commit lives only on its tag. No ruleset covers tags.
      # The major tag (v0, v1, ...) moves to each release, so a workflow that
      # uses agent-labs-dev/bugpatrol@v0 gets new releases without an edit.
      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/bugpatrol/package.json packages/bughunters/package.json action.yml
          git commit -m "release: bugpatrol v$VERSION"
          git tag "v$VERSION"
          git tag -f "v${VERSION%%.*}"
          git push origin "v$VERSION"
          git push -f origin "v${VERSION%%.*}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.value }}" --generate-notes
