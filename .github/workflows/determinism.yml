# Bugpatrol's own must-pass test.
#
# M3's acceptance criterion is the single most important one in the roadmap:
# three consecutive runs against an UNCHANGED commit must produce zero diffs
# across every screen and every viewport. It is the property every competitor
# fails, and until it holds, nothing built on top of the signal can be trusted.
#
# So it runs on every commit, not nightly, and a failure here is treated as a
# product defect rather than a flake to be retried.
#
# CI calls it, and its required `build` check passes only when this does: a
# merge queue waits for required checks alone, so a separate workflow here
# would be advisory.
name: Determinism

on:
  workflow_call:

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here: it is read from package.json's packageManager,
      # and pinning it twice makes the action refuse to run at all.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install the pinned browser build
        run: pnpm --filter @bugpatrol/capture exec playwright install --with-deps chromium

      - name: Capture baselines, then run three times against the same commit
        # Invoked through bash: file modes do not survive the signed publish
        # path, so the executable bit cannot be relied on.
        run: bash scripts/determinism-check.sh

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: determinism-diffs
          path: |
            examples/fixture-app/.bugpatrol/runs/gate/
            /tmp/determinism-run-*.log
          retention-days: 7

  # The runner image is what makes the guarantee above portable. Building it on
  # every commit is how a Dockerfile change that breaks the font set gets caught
  # here rather than as a mysterious diff storm in somebody's PR.
  runner-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t bugpatrol-runner:ci -f images/runner/Dockerfile .
