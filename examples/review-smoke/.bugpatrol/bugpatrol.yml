# The smoke test of the GitHub Action (.github/workflows/review-smoke.yml).
# It reviews each pull request of this repo against the fixture app.
version: 1

app:
  platform: web
  # The repo root: the review makes its worktrees from it.
  source: ../..
  setup:
    - run: node examples/fixture-app/server.js
      cwd: ../..
      background: true
      readyWhen: fixture-app on http
      timeoutMs: 30000
  connect:
    url: http://localhost:3300/

agents:
  review:
    # Two more smoke reviews post on the same pull request: review-smoke-dashboard and review-smoke-cli.
    name: fixture-app
  explorer:
    budgetUsd: 0.5
  judge:
    budgetUsd: 0.5
  github:
    enabled: true
