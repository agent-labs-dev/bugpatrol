# A smoke test of Bugpatrol's own dashboard (.github/workflows/review-smoke.yml).
# Each build of the pull request writes the dashboard fixture and serves it.
version: 1

app:
  platform: web
  # The repo root: the review makes its worktrees from it, and the setup
  # commands below run in the worktree of each build.
  source: ../..
  setup:
    # The worktree sits below this folder, so without a config of its own the
    # fixture would resolve to this project and its empty runs/.
    - run: |
        node packages/dashboard/scripts/fixture.mjs .review-smoke
        printf 'version: 1\napp:\n  connect: { url: "http://127.0.0.1:4311/" }\n' > .review-smoke/.bugpatrol/bugpatrol.yml
      cwd: ../..
      timeoutMs: 120000
    - run: cd .review-smoke && exec node ../packages/cli/dist/bin.js dashboard --port 4311
      cwd: ../..
      background: true
      readyWhen: Bugpatrol dashboard on http
      timeoutMs: 30000
  connect:
    url: http://127.0.0.1:4311/

agents:
  review:
    name: dashboard
  explorer:
    maxSteps: 15
    budgetUsd: 0.5
  judge:
    budgetUsd: 0.5
  fixer:
    retest:
      # Each build runs from its own worktree, so each needs its own install and build.
      prepare: pnpm install --frozen-lockfile && pnpm build
  github:
    enabled: true
