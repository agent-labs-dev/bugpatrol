# Mergepatrol reads this file from the default branch. The dashboard opens a PR to change it.
version: 1
label: mergepatrol
batch_size: 8
resolver:
  provider: anthropic
  model: claude-opus-5-5
  effort: medium
# Run in Mergepatrol's job sandbox after an agent resolves a conflict or commits a fix, before
# anything is pushed, and offered to the agent to check its own work. They mirror CI's `build`
# job except `pnpm test`, which needs Chromium and ffmpeg that the sandbox lacks. `build`, a
# required check, still runs all of it on the head Mergepatrol pushes, before any merge.
verify:
  - pnpm install --frozen-lockfile
  - pnpm check --error-on-warnings
  - pnpm knip
  - pnpm typecheck
  - pnpm --filter @bugpatrol/site typecheck
fix_ci:
  enabled: true
  attempts: 2
